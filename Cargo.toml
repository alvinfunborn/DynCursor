[package]
name = "DynCursor"
version = "1.1.2"
authors = ["zhouwenxiang <zhouwx@lanxi.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/alvinfunborn/DynCursor"
homepage = "https://alvinfunborn.github.io/DynCursor/"

[build-dependencies]
tauri-build = "2"

[dependencies]
# 基础组件
log = "0.4"
log4rs = "1.4"
log-panics = "2.0"
serde_yaml = "0.8.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
base64 = "0.23"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies.windows]
version = "0.24"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_TextServices",
]
